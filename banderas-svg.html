<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="styles/styles.css">
    <title>Banderas con SVG</title>
    <style>
        section{
            display: block;
        }
        @media (min-width: 768px){
            .rejilla {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            width: 90%;
            margin: 0 auto;
            gap: 12px;
        }
        }
        

        .bandera{
            background-color: rgb(242, 248, 248);
            color: black;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.22);
            min-height: 200px;
            padding: 20px; 
        }

        svg{
            box-shadow: 2px 2px 6px 4px rgb(78, 74, 74);
        }
    </style>
</head>
<body>
    <header>
        <div class="encabezado">
            <h1 class="letras-encabezado">Banderas del mundo con vectores SVG</h1>
            
        </div>
        
        
    </header>
    <p></p>
    <main>
        <section>
            <div class="rejilla">
                <div class="bandera">
                    <h2>Francia</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="2" height="4" x="0" y="0" fill="#002654" />
                        <rect width="2" height="4" x="4" y="0" fill="#ED2939" />
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Holanda</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="1.3333" x="0" y="0" fill="#AE1C28" />
                        <rect width="6" height="1.3333" x="0" y="2.7" fill="#21468B" />
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Colombia</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="2" x="0" y="0" fill="#FCD116" />
                        <rect width="6" height="1" x="0" y="2" fill="#0038A8" />
                        <rect width="6" height="1" x="0" y="3" fill="#CE1126" />
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Suiza</h2>
                    <svg width="100" height="100" viewBox="0 0 5 5">
                        <rect width="5" height="5" x="0" y="0" fill="#FF0000" />
                        <polygon points="2,1 3,1 3,2 4,2 4,3 3,3 3,4 2,4 2,3 1,3 1,2 2,2" fill="#FFFFFF"/>
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Japón</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="4" x="0" y="0" fill="#FFFFFF" />
                        <circle cx="3" cy="2" r="1" fill="#FF0000"/>
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Vietnam</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="4" x="0" y="0" fill="#FF0000" />
                        <polygon points="
                            1.4265,0.4635, 0.5706,-0.1854,
                            0.8816,-1.2135, 0,-0.6,
                            -0.8816,-1.2135, -0.5706,-0.1854,
                            -1.4265,0.4635, -0.3526,0.4854,
                            0,1.5, 0.3526,0.4854" 
                            fill="#FFFF00" transform="translate(3 2) rotate(36) scale(1)"/>
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Brasil</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="4" x="0" y="0" fill="#009440" />
                        <polygon points="3,0.5 5.5,2 3,3.5 0.5,2" fill="#FFCB00" />
                        <circle cx="3" cy="2" r="1" fill="#302681" />
                        <polygon points="2.0,2.15 3.98,1.8 4.0,1.95 2.02,2.3" fill="#FFFFFF" />
                        <circle cx="3.0" cy="1.4" r="0.04" fill="#FFFFFF" />
                        <circle cx="2.4" cy="2.3" r="0.03" fill="#FFFFFF" />
                        <circle cx="2.6" cy="2.5" r="0.04" fill="#FFFFFF" />
                        <circle cx="2.8" cy="2.2" r="0.03" fill="#FFFFFF" />
                        <circle cx="3.0" cy="2.6" r="0.04" fill="#FFFFFF" />
                        <circle cx="3.2" cy="2.4" r="0.03" fill="#FFFFFF" />
                        <circle cx="3.5" cy="2.3" r="0.04" fill="#FFFFFF" />
                        <circle cx="3.6" cy="2.6" r="0.03" fill="#FFFFFF" />
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Botsuana</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="1.4" x="0" y="0" fill="#6DA9D2" />
                        <rect width="6" height="0.2" x="0" y="1.4" fill="#FFFFFF" />
                        <rect width="6" height="1" x="0" y="1.6" fill="#000000" />
                        <rect width="6" height="0.2" x="0" y="2.6" fill="#FFFFFF" />
                        <rect width="6" height="1.4" x="0" y="2.8" fill="#6DA9D2" />
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Benin</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="2" height="4" x="0" y="0" fill="#008751" />
                        <rect width="4" height="2" x="2" y="0" fill="#FCD116" />
                        <rect width="4" height="2" x="2" y="2" fill="#E8112D" />
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Bolibia</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="1.3333" x="0" y="0" fill="#E52A26" />
                        <rect width="6" height="1.3333" x="0" y="1.333" fill="#F9E220" />
                        <rect width="6" height="1.3333" x="0" y="2.7" fill="#13A144" />
                    </svg>
                </div>
                <div class="bandera">
                    <h2>China</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="4" x="0" y="0" fill="#FF0000" />
                        <polygon points="1.4265,0.4635, 0.5706,-0.1854, 0.8816,-1.2135,
                                         0,-0.6, -0.8816,-1.2135, -0.5706,-0.1854,
                                        -1.4265,0.4635, -0.3526,0.4854, 0,1.5, 
                                        0.3526,0.4854" 
                                        fill="#FFFF00" transform="translate(1 1) rotate(36) scale(0.4)"/>
                        <polygon points="1.4265,0.4635, 0.5706,-0.1854,
                                        0.8816,-1.2135, 0,-0.6, -0.8816,
                                        -1.2135, -0.5706,-0.1854, -1.4265,
                                        0.4635, -0.3526,0.4854, 0,1.5,
                                         0.3526,0.4854" fill="#FFFF00" transform="translate(1.8 0.4) rotate(72) scale(0.1)"/>
                        <polygon points="1.4265,0.4635, 0.5706,-0.1854, 
                                        0.8816,-1.2135, 0,-0.6, -0.8816,
                                        -1.2135, -0.5706,-0.1854, -1.4265,
                                        0.4635, -0.3526,0.4854, 0,1.5, 
                                        0.3526,0.4854" fill="#FFFF00" transform="translate(2.1 0.8) rotate(79) scale(0.1)"/>
                        <polygon points="1.4265,0.4635, 0.5706,-0.1854, 
                                        0.8816,-1.2135, 0,-0.6, -0.8816,
                                        -1.2135, -0.5706,-0.1854, -1.4265,
                                        0.4635, -0.3526,0.4854, 0,1.5, 0.3526,0.4854" 
                                        fill="#FFFF00" transform="translate(2.1 1.2) rotate(40) scale(0.1)"/>
                        <polygon points="1.4265,0.4635, 0.5706,-0.1854, 
                                        0.8816,-1.2135, 0,-0.6, -0.8816,
                                        -1.2135, -0.5706,-0.1854, -1.4265,
                                        0.4635, -0.3526,0.4854, 0,1.5, 0.3526,0.4854" 
                                        fill="#FFFF00" transform="translate(1.8 1.6) rotate(40) scale(0.1)"/>
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Chile</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="4" x="0" y="0" fill="#FF0000" />
                        <rect width="2" height="2" x="0" y="0" fill="#0000FF" />
                        <polygon points="1.4265,0.4635, 0.5706,-0.1854, 0.8816,
                                        -1.2135, 0,-0.6, -0.8816,-1.2135, -0.5706,
                                        -0.1854, -1.4265,0.4635, -0.3526,0.4854, 
                                        0,1.5, 0.3526,0.4854" 
                                        fill="#FFFFFF" transform="translate(1 1) rotate(36) scale(0.5)"/>
                        <rect width="4" height="2" x="2" y="0" fill="#FFFFFF" />
                    </svg>
                </div>
                <div class="bandera">
                    <h2>Cuba</h2>
                    <svg width="150" height="100" viewBox="0 0 6 4">
                        <rect width="6" height="0.8" x="0" y="0" fill="#0000FF" />
                        <rect width="6" height="0.8" x="0" y="0.8" fill="#FFFFFF" />
                        <rect width="6" height="0.8" x="0" y="1.6" fill="#0000FF" />
                        <rect width="6" height="0.8" x="0" y="3.2" fill="#0000FF" />
                        <rect width="2" height="2" x="0" y="0" fill="#FF0000" transform="translate(0 0) rotate(45) scale(1.4)" />
                        <polygon points="1.4265,0.4635, 0.5706,
                                        -0.1854, 0.8816,-1.2135, 0,-0.6, -0.8816,
                                        -1.2135, -0.5706,-0.1854, -1.4265,0.4635, 
                                        -0.3526,0.4854, 0,1.5, 0.3526,0.4854" 
                                        fill="#FFFFFF" transform="translate(0.8 2) rotate(36) scale(0.4)"/>
                    </svg>
                </div>
            </div>
        </section>
    </main>
    <p style="height: 80px;"></p>
    <footer>
        <hr>
        Todos los derechos reservados &copy; 2026 | TSJ | Cristian Rodriguez
    </footer>
</body>
</html>
